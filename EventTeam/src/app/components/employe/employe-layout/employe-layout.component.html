<div class="employe-shell">
  <app-employe-sidebar [currentUser]="currentUser"></app-employe-sidebar>
  <div class="employe-main">
    <header class="topbar">
      <div class="topbar-left">
        <span class="today">{{ todayLabel }}</span>
      </div>
      <div class="topbar-right">
        <a class="user-chip" routerLink="/employee/profil">
          <div class="avatar" style="background:#6c5ce7">
            {{ getInitials(currentUser?.name) }}
          </div>
          <span class="user-name">{{ currentUser?.name || 'Utilisateur' }}</span>
        </a>
      </div>
    </header>
    <div class="page-content">
      <router-outlet></router-outlet>
    </div>
  </div>
</div>
