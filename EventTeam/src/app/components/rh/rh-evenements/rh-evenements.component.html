<div class="page-header row">
  <div>
    <h1>Événements</h1>
    <p>{{ events.length }} événements au total</p>
  </div>
  <button class="btn-primary" (click)="onCreate()">
    <span>+</span> Nouvel événement
  </button>
</div>
<div class="tabs">
  <button class="tab" [class.active]="activeTab === 'Tous'" (click)="setTab('Tous')">Tous</button>
  <button class="tab" [class.active]="activeTab === 'À venir'" (click)="setTab('À venir')">À venir</button>
  <button class="tab" [class.active]="activeTab === 'Terminé'" (click)="setTab('Terminé')">Terminé</button>
</div>
<div class="events-grid">
  <div class="event-card" *ngFor="let event of filteredEvents">
    <div class="event-thumb" [style.backgroundImage]="'url(' + (event.imageUrl || 'https://images.unsplash.com/photo-1511578314322-379afb476865?w=300') + ')'">
      <span class="status-pill" [class.done]="event.status === 'Terminé'">{{ event.status }}</span>
      <div class="date-badge">
        <span class="day">{{ event.date | date: 'dd' }}</span>
        <span class="month">{{ event.date | date: 'MMM' }}</span>
      </div>
    </div>
    <div class="event-body">
      <h3>{{ event.name }}</h3>
      <p class="location"> {{ event.location }}</p>
      <div class="progress-track">
        <div
          class="progress-fill"
          [style.width.%]="progressPercent(event)"
          [style.background]="progressColor(progressPercent(event))"
        ></div>
      </div>
      <p class="capacity">{{ event.registeredCount }}/{{ event.maxCapacity }} inscrits</p>
      <div class="actions-row">
        <button class="link-btn edit" (click)="onEdit(event)">✏ Modifier</button>
        <button class="link-btn delete" (click)="onDelete(event)"> Supprimer</button>
      </div>
    </div>
  </div>
</div>
