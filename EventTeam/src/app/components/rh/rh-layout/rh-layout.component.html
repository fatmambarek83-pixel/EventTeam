<div class="rh-shell">
  <app-rh-sidebar [currentUser]="currentUser"></app-rh-sidebar>
  <div class="rh-main">
    <header class="topbar">
      <div class="topbar-right">
        <div class="user-chip" (click)="goToProfile()">
          <div class="avatar" style="background:#7c5dfa">
            {{ getInitials(currentUser?.name) }}
          </div>
          <span class="user-name">{{ currentUser?.name || 'Utilisateur' }}</span>
        </div>
      </div>
    </header>
    <div class="page-content">
      <router-outlet></router-outlet>
    </div>
  </div>
</div>
