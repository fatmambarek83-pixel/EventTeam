<div class="page-header">
  <h1>Mon Profil</h1>
  <p>Gérez vos informations personnelles</p>
</div>
<div class="profile-card">
  <div class="profile-summary">
    <div class="avatar-lg" [style.background]="currentUser?.avatarColor || '#7c6cf2'">
      {{ currentUser?.avatarInitials }}
    </div>
    <div>
      <h3>{{ currentUser?.name }}</h3>
      <span class="role-badge">{{ currentUser?.role }}</span>
    </div>
  </div>
  <form [formGroup]="form" (ngSubmit)="onSave()" class="profile-form">
    <label class="field">
      <span>Nom complet</span>
      <input type="text" formControlName="name" />
    </label>
    <label class="field">
      <span>Email</span>
      <input type="email" formControlName="email" />
    </label>
    <label class="field">
      <span>Département</span>
      <input type="text" formControlName="departement" placeholder="Ressources Humaines" />
    </label>
    <div class="form-actions">
      <button type="submit" class="btn-primary">Enregistrer les modifications</button>
      <span class="saved-msg" *ngIf="saved">✓ Profil mis à jour</span>
      <span class="error-msg" *ngIf="saveError">✕ Échec de la mise à jour</span>
    </div>
  </form>
</div>
