<div class="page-header">
  <h1>Mon Profil</h1>
  <p>Gérez les informations de votre entreprise</p>
</div>
<div class="profile-card">
  <div class="profile-summary">
    <div class="avatar-lg" [style.background]="!photo ? (currentUser?.avatarColor || '#f59e0b') : null">
      <img *ngIf="photo" [src]="photo" alt="Photo de profil" class="avatar-img">
      <span *ngIf="!photo">{{ getInitials(currentUser?.name) }}</span>

      <div class="avatar-spinner-overlay" *ngIf="photoUploading">
        <div class="spinner-small"></div>
      </div>

      <label class="avatar-edit" title="Modifier la photo">
        <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="white" stroke-width="2.5">
          <path d="M12 20h9M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/>
        </svg>
        <input type="file" accept="image/*" hidden (change)="onPhotoSelected($event)">
      </label>

      <button class="avatar-remove" *ngIf="photo" title="Supprimer la photo" (click)="onDeletePhoto()">×</button>
    </div>
    <div>
      <h3>{{ currentUser?.name }}</h3>
      <span class="role-badge">Entreprise Ext.</span>
      <p class="photo-error" *ngIf="photoError">{{ photoError }}</p>
    </div>
  </div>
  <form [formGroup]="form" (ngSubmit)="onSave()" class="profile-form">
    <label class="field">
      <span>Nom de l'entreprise</span>
      <input type="text" formControlName="name" />
    </label>
    <label class="field">
      <span>Email</span>
      <input type="email" formControlName="email" />
    </label>
    <label class="field">
      <span>Contact</span>
      <input type="text" formControlName="contactName" placeholder="Nom du contact principal" />
    </label>
    <label class="field">
      <span>Téléphone</span>
      <input type="tel" formControlName="phone" placeholder="+33 6 12 34 56 78" />
    </label>
    <div class="form-actions">
      <button type="submit" class="btn-primary">Enregistrer les modifications</button>
      <span class="saved-msg" *ngIf="saved">✓ Profil mis à jour</span>
      <span class="error-msg" *ngIf="saveError">✕ Échec de la mise à jour</span>
    </div>
  </form>
</div>

<div class="profile-card">
  <h3 class="pwd-title">Changer le mot de passe</h3>
  <a routerLink="/forgot-password" class="pwd-forgot-link">Mot de passe oublié ?</a>

  <form [formGroup]="passwordForm" (ngSubmit)="onChangePassword()" class="profile-form">
    <label class="field">
      <span>Mot de passe actuel</span>
      <input type="password" formControlName="currentPassword" autocomplete="current-password" />
    </label>
    <label class="field">
      <span>Nouveau mot de passe</span>
      <input type="password" formControlName="newPassword" autocomplete="new-password" />
    </label>
    <label class="field">
      <span>Confirmer le nouveau mot de passe</span>
      <input type="password" formControlName="confirmPassword" autocomplete="new-password" />
    </label>

    <div class="form-actions">
      <button type="submit" class="btn-outline" [disabled]="passwordSaving">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="4" y="10" width="16" height="10" rx="2"/>
          <path d="M8 10V7a4 4 0 018 0v3"/>
        </svg>
        {{ passwordSaving ? 'Modification...' : 'Modifier le mot de passe' }}
      </button>
      <span class="saved-msg" *ngIf="passwordSaved">✓ Mot de passe modifié</span>
      <span class="error-msg" *ngIf="passwordError">✕ {{ passwordError }}</span>
    </div>
  </form>
</div>
