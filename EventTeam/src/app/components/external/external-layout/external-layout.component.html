<div class="external-shell">
  <app-external-sidebar [currentUser]="currentUser"></app-external-sidebar>
  <div class="external-main">
    <header class="topbar">
      <div class="topbar-left">
        <span class="today">{{ todayLabel }}</span>
      </div>
      <div class="topbar-right">
        <button class="icon-btn" title="Notifications">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/>
            <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>
          </svg>
          <span class="dot"></span>
        </button>
        <a class="user-chip" routerLink="/external/profil">
          <div class="avatar" style="background:#f59e0b">
            {{ getInitials(currentUser?.name) }}
          </div>
          <span class="user-name">{{ currentUser?.name || 'Utilisateur' }}</span>
        </a>
      </div>
    </header>
    <div class="page-content">
      <router-outlet></router-outlet>
    </div>
  </div>
</div>
