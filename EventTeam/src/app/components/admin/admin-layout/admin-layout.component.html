<div class="admin-container">
  <app-sidebar [currentUser]="currentUser"></app-sidebar>
  <main class="main-content">
    <header class="top-header">
      <!-- Zone gauche: KHAWYA (recherche supprimee) -->
      <div class="header-left"></div>
      <!-- Zone droite: Profile -->
      <div class="header-right">
        <!-- Profile badge -->
        <div class="profile-badge" (click)="goToProfile()">
          <span class="avatar">
            <img *ngIf="photo" [src]="photo" alt="Photo de profil" class="avatar-img">
            <ng-container *ngIf="!photo">{{ (currentUser?.email || 'A').charAt(0).toUpperCase() }}</ng-container>
          </span>
          <span class="profile-name">{{ currentUser?.name || 'Administrateur' }}</span>
        </div>
      </div>
    </header>
    <div class="content-body">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
